server:
  port: 8080

spring:
  application:
    name: yuqing-backend
  datasource:
    url: jdbc:h2:file:./data/yuqing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: ${YUQING_H2_CONSOLE:false}
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      enabled: true

# 数据文件路径
yuqing:
  cors:
    # 生产部署时通过 YUQING_CORS_ALLOWED_ORIGINS 设置实际前端域名，多个地址用逗号分隔。
    allowed-origins: ${YUQING_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  classified-results:
    enabled: true
    # 五批已分类结果共 7,790 条；启动时以帖子 ID 幂等同步。
    files: "../500.json,../1000.json,../1500.json,../2000.json,../3000.json"
  ai:
    # OpenAI-compatible /chat/completions API. Leave blank to use the local
    # structured-data engine; never commit a real key to this file.
    api-key: ${YUQING_AI_API_KEY:}
    base-url: ${YUQING_AI_BASE_URL:https://vip.dmxapi.com/v1}
    model: ${YUQING_AI_MODEL:dsV4pro}
    timeout-seconds: ${YUQING_AI_TIMEOUT_SECONDS:90}
    # Keep interactive chat fast. DMXAPI notes that some Qwen models enable
    # reasoning by default unless this parameter is explicitly set to false.
    enable-thinking: ${YUQING_AI_ENABLE_THINKING:false}
    max-tokens: ${YUQING_AI_MAX_TOKENS:600}
  task2:
    # 第二位同学末代三阶段分类工作流。默认复用 AI 配置，也可单独覆盖。
    api-key: ${YUQING_TASK2_API_KEY:${YUQING_AI_API_KEY:}}
    base-url: ${YUQING_TASK2_BASE_URL:${YUQING_AI_BASE_URL:https://vip.dmxapi.com/v1}}
    model: ${YUQING_TASK2_MODEL:${YUQING_AI_MODEL:dsV4pro}}
    timeout-seconds: ${YUQING_TASK2_TIMEOUT_SECONDS:120}
    max-tokens: ${YUQING_TASK2_MAX_TOKENS:6000}
    # 为避免导入大量历史数据时意外产生模型费用，默认关闭自动实时分类。
    auto-classify-imports: ${YUQING_TASK2_AUTO_CLASSIFY_IMPORTS:false}
    auto-classify-limit: ${YUQING_TASK2_AUTO_CLASSIFY_LIMIT:20}
  auth:
    nickname: ${YUQING_AUTH_NICKNAME:管理员}
    # 首次部署必须通过环境变量设置；修改密码后使用数据库中的加密口令。
    password: ${YUQING_AUTH_PASSWORD:}
    session-hours: ${YUQING_AUTH_SESSION_HOURS:24}
  # 兼容旧原始数据模式；启用 classified-results 后不会读取这两个文件。
  data-file: "../posts(2).json"
  # 评论按 comment_id 增量同步，通过 thread_id 与帖子 id 关联。
  comment-file: "../comments.json"
  # 定时任务配置（每小时执行一次分析）
  schedule:
    analyze-cron: "0 0 * * * ?"
    aggregate-cron: "0 5 * * * ?"
