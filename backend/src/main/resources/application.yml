server:
  port: 8080

spring:
  application:
    name: yuqing-backend
  datasource:
    url: jdbc:h2:mem:yuqing;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

# 数据文件路径
yuqing:
  data-file: ../posts.json
